[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "node /app/docker/start-web.mjs"
preDeployCommand = "node /app/docker/migrate-with-lock.mjs"
healthcheckPath = "/api/v1/health/ready"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
drainingSeconds = 30
