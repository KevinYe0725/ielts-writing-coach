name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/kevinye0725/ielts-writing-coach

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:17.6-bookworm
        env:
          POSTGRES_DB: iwc_release
          POSTGRES_USER: iwc
          POSTGRES_PASSWORD: iwc_release
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U iwc -d iwc_release"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://iwc:iwc_release@127.0.0.1:5432/iwc_release
      NEXT_PUBLIC_DEMO_MODE: "true"
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:3201
      IWC_E2E_PROVIDER: mock
      NODE_ENV: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Secret scan
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.16.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.14.0
          cache: pnpm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - run: pnpm install --frozen-lockfile
      - name: Dependency vulnerability audit
        run: pnpm security:audit
      - name: Dependency license policy
        run: pnpm licenses:check
      - run: python -m pip install --disable-pip-version-check PyYAML==6.0.3
      - name: Verify tag and package versions agree
        run: node tests/quality/verify-release-version.mjs "${GITHUB_REF_NAME}"
      - name: Require complete versioned release notes
        run: node tests/quality/verify-release-notes.mjs "${GITHUB_REF_NAME}"
      - name: Require completed human-review evidence
        run: node tests/quality/validate-human-review.mjs tests/human-review/v1/review-run.json
      - run: pnpm db:migrate
      - run: pnpm validate
      - name: Deterministic v1 benchmark corpus
        run: pnpm exec vitest run --config tests/quality/vitest.config.ts
      - run: pnpm skill:validate
      - name: Require current fresh-agent Skill evidence
        run: pnpm skill:forward:validate
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: release-playwright-report
          path: playwright-report
          retention-days: 7

  container-smoke:
    needs: verify
    name: Container smoke (${{ matrix.arch }})
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            docker_architecture: amd64
          - arch: arm64
            platform: linux/arm64
            docker_architecture: arm64
    env:
      COMPOSE_PROJECT_NAME: iwc-release-smoke-${{ matrix.arch }}
      IWC_IMAGE: ielts-writing-coach:release-smoke-${{ matrix.arch }}
      IWC_PORT: 3100
      IWC_POSTGRES_PORT: 55434
      APP_URL: http://127.0.0.1:3100
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.16.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.14.0
          cache: pnpm
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4
        id: qemu
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - name: Verify runtime emulation before the cross-platform build
        if: matrix.arch == 'arm64'
        env:
          QEMU_PLATFORMS: ${{ steps.qemu.outputs.platforms }}
        run: |
          printf '%s\n' "${QEMU_PLATFORMS}" | tr ',' '\n' | grep -qx 'linux/arm64'
          test "$(docker run --rm --platform linux/arm64 alpine:3.22 uname -m)" = aarch64
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: docker compose config --quiet
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: false
          load: true
          tags: ${{ env.IWC_IMAGE }}
          build-args: |
            VERSION=${{ github.ref_name }}
            VCS_REF=${{ github.sha }}
          cache-from: type=gha,scope=release-smoke-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=release-smoke-${{ matrix.arch }}
      - name: Verify loaded image architecture
        run: test "$(docker image inspect "${IWC_IMAGE}" --format '{{.Architecture}}')" = '${{ matrix.docker_architecture }}'
      - name: Compose release smoke test
        run: |
          docker compose up -d --no-build --wait --wait-timeout 180
          curl --fail --show-error --silent http://127.0.0.1:3100/api/v1/health/ready

          migrate_id="$(docker compose ps -aq migrate)"
          test -n "${migrate_id}"
          test "$(docker inspect "${migrate_id}" --format '{{.State.Status}}|{{.State.ExitCode}}')" = 'exited|0'

          web_id="$(docker compose ps -q web)"
          worker_id="$(docker compose ps -q worker)"
          test -n "${web_id}"
          test -n "${worker_id}"
          test "$(docker inspect "${web_id}" --format '{{.Config.User}}|{{.State.Status}}|{{.RestartCount}}')" = 'iwc|running|0'
          test "$(docker inspect "${worker_id}" --format '{{.Config.User}}|{{.State.Status}}|{{.RestartCount}}')" = 'iwc|running|0'

          probe_key="release-${{ matrix.arch }}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker compose exec -T postgres psql -X -v ON_ERROR_STOP=1 -U iwc -d iwc -qAtc \
            "SELECT id FROM graphile_worker.add_job(identifier := 'dispatch_notifications', payload := '{}'::json, max_attempts := 1, job_key := '${probe_key}');" >/dev/null
          remaining=1
          for _attempt in $(seq 1 60); do
            remaining="$(docker compose exec -T postgres psql -X -v ON_ERROR_STOP=1 -U iwc -d iwc -qAtc "SELECT count(*) FROM graphile_worker.jobs WHERE key = '${probe_key}';")"
            if test "${remaining}" = 0; then
              break
            fi
            sleep 1
          done
          test "${remaining}" = 0
          sleep 3
          test "$(docker inspect "${worker_id}" --format '{{.State.Status}}|{{.RestartCount}}')" = 'running|0'

          if test '${{ matrix.arch }}' = amd64; then
            secrets_volume="$(docker volume ls \
              --filter "label=com.docker.compose.project=${COMPOSE_PROJECT_NAME}" \
              --filter 'label=com.docker.compose.volume=iwc_secrets' \
              --format '{{.Name}}' | head -n 1)"
            test -n "${secrets_volume}"
            setup_token="$(docker run --rm \
              -v "${secrets_volume}:/run/iwc-secrets:ro" \
              "${IWC_IMAGE}" \
              node -e "process.stdout.write(require('node:fs').readFileSync('/run/iwc-secrets/setup_token','utf8').trim())")"
            test -n "${setup_token}"
            echo "::add-mask::${setup_token}"
            IWC_COMPOSE_FULL_E2E=true \
              IWC_E2E_SETUP_TOKEN="${setup_token}" \
              PLAYWRIGHT_BASE_URL=http://127.0.0.1:3100 \
              pnpm exec playwright test --config tests/deployment/playwright.compose.config.ts
            unset setup_token
          else
            PLAYWRIGHT_BASE_URL=http://127.0.0.1:3100 \
              pnpm exec playwright test --config tests/deployment/playwright.compose.config.ts
          fi
      - name: Compose logs on failure
        if: failure()
        # Never publish bootstrap's still-valid one-time setup token.
        run: docker compose logs --no-color web worker migrate postgres
      - name: Compose cleanup
        if: always()
        run: docker compose down --volumes --remove-orphans
      - name: Isolated backup and clean-instance restore gate
        if: matrix.arch == 'amd64' && success()
        env:
          IWC_RECOVERY_IMAGE: ${{ env.IWC_IMAGE }}
        run: scripts/verify-compose-backup-restore.sh

  image:
    needs: container-smoke
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            VCS_REF=${{ github.sha }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - run: |
          mkdir -p release
          printf '%s  %s\n' '${{ steps.build.outputs.digest }}' '${{ env.IMAGE_NAME }}' > release/image-digest.txt
          (cd .agents/skills && zip -r "../../release/coach-ielts-writing-${GITHUB_REF_NAME}.zip" coach-ielts-writing)
          zip -j "release/coach-ielts-writing-${GITHUB_REF_NAME}.zip" LICENSE NOTICE
          sha256sum release/image-digest.txt "release/coach-ielts-writing-${GITHUB_REF_NAME}.zip" > release/SHA256SUMS
      - name: Attest Skill archive
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: release/coach-ielts-writing-${{ github.ref_name }}.zip
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          draft: false
          generate_release_notes: true
          body_path: docs/releases/${{ github.ref_name }}.md
          files: release/*
