name: DCO

on:
  pull_request:

permissions:
  contents: read

jobs:
  signoff:
    runs-on: ubuntu-24.04
    steps:
      - name: Trust GitHub's Dependabot service identity
        if: github.actor == 'dependabot[bot]'
        run: echo "Dependabot-generated commits are exempt from human DCO sign-off."
      # Check out the trusted base revision so a pull request cannot weaken
      # the DCO checker it is being evaluated by.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.actor != 'dependabot[bot]'
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.base.sha }}
      - name: Fetch the untrusted head as an object only
        if: github.actor != 'dependabot[bot]'
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          git fetch --no-tags origin "refs/pull/${PR_NUMBER}/head"
          test "$(git rev-parse FETCH_HEAD)" = "${HEAD_SHA}"
      - name: Check every pull-request commit with the trusted checker
        if: github.actor != 'dependabot[bot]'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/check-dco.mjs "${BASE_SHA}" "${HEAD_SHA}"
