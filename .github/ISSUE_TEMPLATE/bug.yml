name: Bug report
description: Report a reproducible problem without including essays or API keys.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Never paste provider keys, full private essays, database dumps, or authentication cookies.
  - type: input
    id: version
    attributes:
      label: Version or image digest
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: Deployment
      options:
        [
          Docker Compose,
          Railway,
          Render community config,
          Local development,
          Codex Skill,
        ]
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps with private content removed
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
